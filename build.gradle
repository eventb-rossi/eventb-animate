plugins {
	id 'java'
	id 'eclipse'
	id 'application'
	id 'com.diffplug.spotless' version '8.10.3'
	id 'com.github.spotbugs' version '6.5.12'
	id 'com.gradleup.shadow' version '9.6.1'
}

version = '7.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

def prob_version = "4.16.1"
application {
	mainClass = "animate.Animate"
}


repositories {
	mavenCentral()
	maven {
		name = "snapshot"
		url = "https://oss.sonatype.org/content/repositories/snapshots/"
	}
}

configurations.all {
	// Kernel front ends for other formalisms; eventb-animate only loads Event-B.
	exclude group: 'de.hhu.stups', module: 'tlc4b'
	exclude group: 'de.hhu.stups', module: 'tlatools'
	exclude group: 'de.hhu.stups', module: 'alloy-core'
	exclude group: 'org.apache.velocity', module: 'velocity-engine-core'
}

dependencies {
	implementation 'ch.qos.logback:logback-classic:1.6.5'
	implementation 'info.picocli:picocli:4.7.7'
	implementation "de.hhu.stups:prob-java:${prob_version}"
	// Used directly by the --json report writer; pinned to the version the kernel
	// already resolves transitively (re-check `gradlew dependencies` when bumping
	// prob_version so the two stay aligned).
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.hamcrest:hamcrest:3.0'
	testImplementation 'com.networknt:json-schema-validator:3.0.8'
}

spotless {
	java {
		googleJavaFormat('1.34.1')
	}
}

tasks.withType(JavaCompile).configureEach {
	options.deprecation = true
}

test {
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
		showStandardStreams = true
	}
}

// The fat jar is built by Shadow so duplicate META-INF/services entries are
// merged instead of silently dropped; the plain jar is disabled so that
// build/libs/eventb-animate-*.jar matches exactly one (runnable) artifact.
jar {
	// Disabled, but keeps a distinct classifier so its declared output does not
	// overlap with shadowJar's; the manifest below is inherited by shadowJar.
	enabled = false
	archiveClassifier = 'plain'
	manifest {
		attributes(
			'Main-Class': 'animate.Animate',
			'Implementation-Version': project.version
		)
	}
}

def servicePrefix = 'META-INF/services/'
def serviceProviders = { zip, entry ->
	zip.getInputStream(entry).withCloseable { stream ->
		stream.getText('UTF-8').readLines()
			.collect { it.replaceFirst(/#.*/, '').trim() }
			.findAll { !it.isEmpty() }
	}
}

def shadowJarTask = tasks.named('shadowJar')
def verifyShadowServices = tasks.register('verifyShadowServices') {
	group = 'verification'
	description = 'Verify runtime service providers in the shaded jar'
	dependsOn shadowJarTask
	inputs.files(configurations.runtimeClasspath)
	inputs.file(shadowJarTask.flatMap { it.archiveFile })

	doLast {
		def expected = [:].withDefault { new LinkedHashSet<String>() }
		configurations.runtimeClasspath.files
			.findAll { it.isFile() && it.name.endsWith('.jar') }
			.sort()
			.each { dependency ->
				new java.util.zip.ZipFile(dependency).withCloseable { zip ->
					zip.entries().each { entry ->
						if (!entry.directory && entry.name.startsWith(servicePrefix)) {
							expected[entry.name].addAll(serviceProviders(zip, entry))
						}
					}
				}
			}

		def actual = [:].withDefault { new LinkedHashSet<String>() }
		def entryCounts = [:].withDefault { 0 }
		new java.util.zip.ZipFile(shadowJarTask.get().archiveFile.get().asFile)
			.withCloseable { zip ->
				zip.entries().each { entry ->
					if (!entry.directory && entry.name.startsWith(servicePrefix)) {
						entryCounts[entry.name]++
						actual[entry.name].addAll(serviceProviders(zip, entry))
					}
				}
			}

		def failures = []
		expected.sort().each { service, providers ->
			if (entryCounts[service] != 1) {
				failures.add("${service}: expected one merged entry, found ${entryCounts[service]}")
			}
			def missing = providers - actual[service]
			if (!missing.isEmpty()) {
				failures.add("${service}: missing providers ${missing.sort().join(', ')}")
			}
		}
		if (!failures.isEmpty()) {
			throw new GradleException(
				'Shaded service verification failed:\n- ' + failures.join('\n- '))
		}
		logger.lifecycle(
			"Verified ${expected.size()} merged service descriptors in " +
				shadowJarTask.get().archiveFileName.get())
	}
}

// -PprobPlatform=<linux64|macos|windows64> keeps only that platform's probcli.
def probPlatform = project.findProperty('probPlatform')
def probPlatforms = ['linux64', 'macos', 'windows64']
if (probPlatform != null && !probPlatforms.contains(probPlatform)) {
	throw new GradleException(
		"probPlatform must be one of ${probPlatforms}, got '${probPlatform}'")
}

shadowJarTask.configure {
	archiveClassifier = ''
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	mergeServiceFiles()
	if (probPlatform != null) {
		probPlatforms.findAll { it != probPlatform }.each {
			exclude "de/prob/cli/binaries/probcli_${it}.zip"
		}
	}
	finalizedBy verifyShadowServices
}

// Only the shadow jar is consumed (the release workflow builds and ships it);
// the distribution archives are ~100 MB each, and the plain ones cannot even
// run with the jar task disabled. Keep all of them out of assemble.
distZip.enabled = false
distTar.enabled = false
shadowDistZip.enabled = false
shadowDistTar.enabled = false

spotbugs {
	effort = 'max'
	reportLevel = 'medium'
	excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html.required = true
		xml.required = false
	}
}

spotbugsTest.enabled = false

tasks.register('lint') {
	dependsOn 'spotlessCheck', 'spotbugsMain'
	group = 'verification'
	description = 'Run formatting check and static analysis'
}

tasks.register('setupGitHooks', Copy) {
	group = 'setup'
	description = 'Install git hooks from hooks/ directory'
	from('hooks/')
	into('.git/hooks/')
	filePermissions {
		unix('rwxr-xr-x')
	}
}
