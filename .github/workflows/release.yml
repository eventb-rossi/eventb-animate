name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Verify version consistency
        run: scripts/check-version.sh "$RELEASE_TAG"

      - name: Download JAR from build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            run_id=$(gh run list \
              --workflow build-gradle-project.yml \
              --commit "${{ github.sha }}" \
              --status success \
              --json databaseId \
              --jq '.[0].databaseId')

            if [ -n "$run_id" ]; then
              echo "Found successful Build and Test run: $run_id"
              gh run download "$run_id" --name eventb-animate.jar
              exit 0
            fi

            echo "Attempt $attempt/15: no successful Build and Test run found yet..."
            sleep 30
          done

          echo "::error::No successful Build and Test run found for commit ${{ github.sha }}."
          echo "::error::Push the branch and wait for Build and Test to pass before tagging."
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage versioned common assets
        run: |
          version="${RELEASE_TAG#v}"
          source_jars=(eventb-animate-*.jar)
          test "${#source_jars[@]}" -eq 1
          mkdir -p release-bundle/assets
          mv "${source_jars[0]}" \
            "release-bundle/assets/eventb-animate-${version}.jar"
          cp RELEASE_NOTES.md release-bundle/RELEASE_NOTES.md
          cp docs/json-report-v3.schema.json \
            "release-bundle/assets/eventb-animate-${version}-json-report-v3.schema.json"

          report_directory="$RUNNER_TEMP/eventb-animate-${version}-report-v3"
          mkdir -p "$report_directory/examples"
          cp docs/json-report-v3.schema.json \
            "$report_directory/json-report-v3.schema.json"
          example_symlink=$(find docs/examples -type l -print -quit)
          if [ -n "$example_symlink" ]; then
            echo "::error::Release examples must not contain symlinks: $example_symlink"
            exit 1
          fi
          find docs/examples -maxdepth 1 -type f \
            -name 'json-report-v3-*.json' \
            -exec cp {} "$report_directory/examples/" \;
          (
            cd "$RUNNER_TEMP"
            zip -q -r -y \
              "$GITHUB_WORKSPACE/release-bundle/assets/eventb-animate-${version}-report-v3.zip" \
              "eventb-animate-${version}-report-v3"
          )

      - name: Smoke test common release jar
        timeout-minutes: 10
        run: |
          version="${RELEASE_TAG#v}"
          scripts/smoke-release.sh \
            "release-bundle/assets/eventb-animate-${version}.jar"

      - name: Upload common release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-common
          path: release-bundle/
          if-no-files-found: error

  release:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download common release assets
        uses: actions/download-artifact@v8
        with:
          name: release-common
          path: release-bundle

      - name: Verify assets and record SHA-256 digests
        run: |
          version="${RELEASE_TAG#v}"
          assets="release-bundle/assets"
          test -f "$assets/eventb-animate-${version}.jar"
          test ! -e "$assets/eventb-animate.jar"
          test -f "$assets/eventb-animate-${version}-json-report-v3.schema.json"
          test -f "$assets/eventb-animate-${version}-report-v3.zip"

          (
            cd "$assets"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | LC_ALL=C sort \
              | xargs sha256sum
          ) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" "$assets/SHA256SUMS"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$RELEASE_TAG"
          release-bundle/assets/*
          --notes-file release-bundle/RELEASE_NOTES.md
          --title "Event-B Animate $RELEASE_TAG"

  # Build self-contained Windows artifacts (bundled JRE, no Java required) with
  # jpackage and attach them to the release created above. Needs [release] so the
  # GitHub Release exists before `gh release upload`. A failure here leaves the
  # release intact with the jar; just re-run this job to add the Windows assets.
  windows-installer:
    needs: [release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build fat jar
        run: ./gradlew shadowJar --no-daemon

      - name: Stage jar and resolve version
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart('v')
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item build/libs/eventb-animate-*.jar staging/eventb-animate.jar

      # Build the app-image once; the ZIP and the MSI are both derived from it.
      # --add-modules ALL-MODULE-PATH bundles the full runtime so the reflection-
      # heavy ProB2/Groovy/Jackson stack cannot hit a missing JDK module at runtime.
      # --win-console keeps the launcher a console app so CLI output is visible.
      - name: Build app-image (jpackage)
        run: >
          jpackage --type app-image --name eventb-animate
          --input staging --main-jar eventb-animate.jar --main-class animate.Animate
          --app-version ${{ env.APP_VERSION }} --add-modules ALL-MODULE-PATH
          --win-console --vendor "Event-B Rossi"
          --description "Animate Event-B models using the ProB model checker"
          --dest dist

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/eventb-animate -DestinationPath eventb-animate-win-x64.zip

      # jpackage on JDK 21 needs WiX 3.x (candle.exe/light.exe); it does not
      # support WiX 4/5. Download the pinned WiX 3.14.1 binaries straight from the
      # official release and verify the SHA-256, instead of depending on the runner
      # image shipping WiX or on the mutable Chocolatey community feed. Adding the
      # extract dir to PATH is enough for jpackage to find candle.exe/light.exe.
      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $sha = "6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31"
          $zip = Join-Path $env:RUNNER_TEMP "wix314.zip"
          $dir = Join-Path $env:RUNNER_TEMP "wix314"
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip; break }
            catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds ($i * 5) }
          }
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha) { throw "WiX checksum mismatch: expected $sha, got $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Build MSI installer (jpackage)
        run: >
          jpackage --type msi --app-image dist/eventb-animate
          --name eventb-animate --app-version ${{ env.APP_VERSION }}
          --win-menu --win-menu-group "Event-B Animate" --dest msi

      - name: Normalize MSI name
        shell: pwsh
        run: Copy-Item msi/eventb-animate-*.msi eventb-animate.msi

      - name: Record Windows SHA-256 digests
        shell: pwsh
        run: |
          $assets = @('eventb-animate-win-x64.zip', 'eventb-animate.msi')
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $lines | Out-File -FilePath SHA256SUMS.windows -Encoding ascii

      - name: Upload Windows assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$RELEASE_TAG"
          eventb-animate-win-x64.zip eventb-animate.msi SHA256SUMS.windows
          --clobber

  # Tell the eventb-rossi packaging repos a new release exists, so their
  # version-check workflows run immediately instead of waiting for the daily cron.
  # This must be a job in this tag-triggered workflow (not a `release:` listener):
  # the release above is created with GITHUB_TOKEN, which never fires further
  # workflow runs. See eventb-rossi/release-automation for the reusable workflow.
  notify-downstream:
    needs: [release]
    uses: eventb-rossi/release-automation/.github/workflows/notify-downstream.yml@main
    with:
      tool: eventb-animate
      version: ${{ github.ref_name }}
    secrets:
      dispatch-token: ${{ secrets.VERSION_BUMP_TOKEN }}
