name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to repair
        required: true
        type: string

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

# Publishing mutates release assets, so runs for the same tag queue instead of
# racing. The `env` context is unavailable here, so RELEASE_TAG is recomputed.
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      # The CI Wrappers workflow runs the same guard, but only for pushes to
      # main — a tag carries no such run, so without this a release publishes
      # over wrapper drift that main went red on hours earlier. v6.6 did.
      - name: Verify the CI wrappers agree
        run: ruby scripts/extract-ci-shell.rb "$RUNNER_TEMP/ci-shell"

      - name: Verify recovery target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! release=$(gh release view "$RELEASE_TAG" \
            --json isDraft,isImmutable); then
            echo "::error::Release $RELEASE_TAG does not exist."
            exit 1
          fi

          if [ "$(jq -r .isDraft <<< "$release")" = true ]; then
            echo "::error::Release $RELEASE_TAG is still a draft."
            exit 1
          fi
          if [ "$(jq -r .isImmutable <<< "$release")" = true ]; then
            echo "::error::Release $RELEASE_TAG is immutable."
            exit 1
          fi

  prepare-release:
    needs: [validate-target]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Verify version consistency
        run: scripts/check-version.sh "$RELEASE_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle for recovery
        if: github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@v6

      - name: Download JAR from build workflow
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 15); do
            run_id=$(gh run list \
              --workflow build-gradle-project.yml \
              --commit "$target_sha" \
              --status success \
              --json databaseId \
              --jq '.[0].databaseId')

            if [ -n "$run_id" ]; then
              echo "Found successful Build and Test run: $run_id"
              gh run download "$run_id" --name eventb-animate.jar
              exit 0
            fi

            echo "Attempt $attempt/15: no successful Build and Test run found yet..."
            sleep 30
          done

          echo "::error::No successful Build and Test run found for commit $target_sha."
          echo "::error::Push the branch and wait for Build and Test to pass before tagging."
          exit 1

      - name: Rebuild JAR for recovery
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew shadowJar --no-daemon
          cp build/libs/eventb-animate-*.jar .

      - name: Stage versioned common assets
        run: |
          version="${RELEASE_TAG#v}"
          source_jars=(eventb-animate-*.jar)
          test "${#source_jars[@]}" -eq 1
          mkdir -p release-bundle/assets
          mv "${source_jars[0]}" \
            "release-bundle/assets/eventb-animate-${version}.jar"
          cp RELEASE_NOTES.md release-bundle/RELEASE_NOTES.md
          cp docs/json-report-v3.schema.json \
            "release-bundle/assets/eventb-animate-${version}-json-report-v3.schema.json"

          report_directory="$RUNNER_TEMP/eventb-animate-${version}-report-v3"
          mkdir -p "$report_directory/examples"
          cp docs/json-report-v3.schema.json \
            "$report_directory/json-report-v3.schema.json"
          example_symlink=$(find docs/examples -type l -print -quit)
          if [ -n "$example_symlink" ]; then
            echo "::error::Release examples must not contain symlinks: $example_symlink"
            exit 1
          fi
          find docs/examples -maxdepth 1 -type f \
            -name 'json-report-v3-*.json' \
            -exec cp {} "$report_directory/examples/" \;
          (
            cd "$RUNNER_TEMP"
            zip -q -r -y \
              "$GITHUB_WORKSPACE/release-bundle/assets/eventb-animate-${version}-report-v3.zip" \
              "eventb-animate-${version}-report-v3"
          )

      - name: Smoke test common release jar
        timeout-minutes: 10
        run: |
          version="${RELEASE_TAG#v}"
          scripts/smoke-release.sh \
            "release-bundle/assets/eventb-animate-${version}.jar"

      - name: Upload common release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-common
          path: release-bundle/
          if-no-files-found: error

  release:
    needs: [prepare-release, windows-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download common release assets
        uses: actions/download-artifact@v8
        with:
          name: release-common
          path: release-bundle

      - name: Download Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: release-bundle/assets

      - name: Verify complete release bundle
        run: |
          version="${RELEASE_TAG#v}"
          assets="release-bundle/assets"
          expected="$RUNNER_TEMP/expected-release-assets"
          actual="$RUNNER_TEMP/actual-release-assets"

          printf '%s\n' \
            "eventb-animate-${version}.jar" \
            "eventb-animate-${version}-json-report-v3.schema.json" \
            "eventb-animate-${version}-report-v3.zip" \
            eventb-animate-win-x64.zip \
            eventb-animate.msi \
            | LC_ALL=C sort > "$expected"
          find "$assets" -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$actual"

          if ! diff -u "$expected" "$actual"; then
            echo "::error::Staged release assets do not match the expected set."
            exit 1
          fi

          (
            cd "$assets"
            xargs sha256sum < "$expected"
          ) > "$assets/SHA256SUMS"
          (
            cd "$assets"
            sha256sum --check SHA256SUMS
          )

          printf '%s\n' SHA256SUMS >> "$expected"
          LC_ALL=C sort -o "$expected" "$expected"

      - name: Create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$RELEASE_TAG"
          release-bundle/assets/*
          --notes-file release-bundle/RELEASE_NOTES.md
          --title "Event-B Animate $RELEASE_TAG"

      - name: Replace existing release assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="release-bundle/assets"
          expected="$RUNNER_TEMP/expected-release-assets"

          gh release upload "$RELEASE_TAG" "$assets"/* --clobber

          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' \
            | while IFS= read -r asset; do
                if ! grep -Fqx "$asset" "$expected"; then
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                fi
              done

      - name: Verify published release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$RUNNER_TEMP/expected-release-assets"
          published="$RUNNER_TEMP/published-release-assets"

          for attempt in $(seq 1 6); do
            gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[].name' \
              | LC_ALL=C sort > "$published"
            if cmp -s "$expected" "$published"; then
              exit 0
            fi
            echo "Attempt $attempt/6: waiting for release assets to settle..."
            sleep 5
          done

          diff -u "$expected" "$published" || true
          echo "::error::Published release assets do not match the expected set."
          exit 1

  # Build self-contained Windows artifacts (bundled JRE, no Java required) with
  # jpackage. The release job publishes them together with the common assets so
  # every release has one complete, checksummed bundle.
  windows-artifacts:
    needs: [validate-target]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build fat jar
        run: ./gradlew shadowJar --no-daemon

      - name: Stage jar and resolve version
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart('v')
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item build/libs/eventb-animate-*.jar staging/eventb-animate.jar

      # Build the app-image once; the ZIP and the MSI are both derived from it.
      # --add-modules ALL-MODULE-PATH bundles the full runtime so the reflection-
      # heavy ProB2/Groovy/Jackson stack cannot hit a missing JDK module at runtime.
      # --win-console keeps the launcher a console app so CLI output is visible.
      - name: Build app-image (jpackage)
        run: >
          jpackage --type app-image --name eventb-animate
          --input staging --main-jar eventb-animate.jar --main-class animate.Animate
          --app-version $env:APP_VERSION --add-modules ALL-MODULE-PATH
          --win-console --vendor "Event-B Rossi"
          --description "Animate Event-B models using the ProB model checker"
          --dest dist

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/eventb-animate -DestinationPath eventb-animate-win-x64.zip

      # jpackage on JDK 21 needs WiX 3.x (candle.exe/light.exe); it does not
      # support WiX 4/5. Download the pinned WiX 3.14.1 binaries straight from the
      # official release and verify the SHA-256, instead of depending on the runner
      # image shipping WiX or on the mutable Chocolatey community feed. Adding the
      # extract dir to PATH is enough for jpackage to find candle.exe/light.exe.
      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $sha = "6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31"
          $zip = Join-Path $env:RUNNER_TEMP "wix314.zip"
          $dir = Join-Path $env:RUNNER_TEMP "wix314"
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip; break }
            catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds ($i * 5) }
          }
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha) { throw "WiX checksum mismatch: expected $sha, got $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Build MSI installer (jpackage)
        run: >
          jpackage --type msi --app-image dist/eventb-animate
          --name eventb-animate --app-version $env:APP_VERSION
          --win-menu --win-menu-group "Event-B Animate" --dest msi

      - name: Normalize MSI name
        shell: pwsh
        run: Copy-Item msi/eventb-animate-*.msi eventb-animate.msi

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-windows | Out-Null
          Copy-Item `
            -Path eventb-animate-win-x64.zip, eventb-animate.msi `
            -Destination release-windows/

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-windows/
          if-no-files-found: error

  # Tell the eventb-rossi packaging repos a new release exists, so their
  # version-check workflows run immediately instead of waiting for the daily cron.
  # This must be a job in this tag-triggered workflow (not a `release:` listener):
  # the release above is created with GITHUB_TOKEN, which never fires further
  # workflow runs. See eventb-rossi/release-automation for the reusable workflow.
  notify-downstream:
    needs: [release]
    if: github.event_name == 'push'
    uses: eventb-rossi/release-automation/.github/workflows/notify-downstream.yml@main
    with:
      tool: eventb-animate
      version: ${{ github.ref_name }}
    secrets:
      dispatch-token: ${{ secrets.VERSION_BUMP_TOKEN }}
