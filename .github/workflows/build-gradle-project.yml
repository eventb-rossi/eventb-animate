name: Build and Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only pull-request runs are cancelled when superseded. A cancelled push run on
# main or on a tag would leave that commit without a successful build, and the
# release workflow refuses to publish a tag it cannot find one for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout project sources
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Check formatting
      run: ./gradlew spotlessCheck --no-daemon

    - name: Static analysis
      run: ./gradlew spotbugsMain --no-daemon

    - name: Install LTSmin integration tools
      env:
        LTSMIN_VERSION: '3.0.2'
        LTSMIN_SHA256: '9112846d1b3f6c4db25179a5712ffc25b98c4c26799250875cba859808de07a1'
      run: |
        archive="$RUNNER_TEMP/ltsmin-linux.tgz"
        curl --fail --location --silent --show-error \
          --output "$archive" \
          "https://github.com/utwente-fmt/ltsmin/releases/download/v${LTSMIN_VERSION}/ltsmin-v${LTSMIN_VERSION}-linux.tgz"
        echo "${LTSMIN_SHA256}  ${archive}" | sha256sum --check --strict
        tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/v${LTSMIN_VERSION}/bin" >> "$GITHUB_PATH"

    - name: Build and Test
      env:
        EVENTB_ANIMATE_REQUIRE_LTSMIN: 'true'
      run: ./gradlew build --no-daemon

    - name: Verify jar version
      run: |
        expected=$(sed -n "s/^version = '\([^']*\)'$/\1/p" build.gradle)
        actual=$(java -jar build/libs/eventb-animate-*.jar --version)
        test "$actual" = "eventb-animate $expected"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: build/test-results/test/*.xml

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: build/reports/tests/test/

    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: eventb-animate.jar
        path: build/libs/eventb-animate-*.jar
        if-no-files-found: error
