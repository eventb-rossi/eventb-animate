name: 'Event-B Animate'
description: 'Model-check Event-B models using the ProB 2.0 model checker'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  model-path:
    description: 'Path to the Event-B model (.bum file, .zip archive, or directory)'
    required: true
  command:
    description: 'Subcommand to run: "check" (model-check, the default) or "replay"'
    required: false
    default: 'check'
  size:
    description: 'Default size for ProB sets (check command)'
    required: false
    default: ''
  states:
    description: 'Bound model-checking to at most N explored states; omit for exhaustive (check command)'
    required: false
    default: ''
  save:
    description: 'Save the counterexample trace to a JSON file when a violation is found (check command)'
    required: false
    default: ''
  trace:
    description: 'Path to JSON trace file (replay command, required when command is "replay")'
    required: false
    default: ''
  args:
    description: 'Extra arguments appended to the assembled command'
    required: false
    default: ''
  version:
    description: 'Release version tag to use (e.g., "v5.1"). Defaults to latest release.'
    required: false
    default: 'latest'
  java-version:
    description: 'Java version to use (must be 21 or later)'
    required: false
    default: '21'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}

    - name: Download eventb-animate
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ "$VERSION" = "latest" ]; then
          url="https://github.com/eventb-rossi/eventb-animate/releases/latest/download/eventb-animate.jar"
        else
          url="https://github.com/eventb-rossi/eventb-animate/releases/download/${VERSION}/eventb-animate.jar"
        fi
        curl -sL --fail -o "${{ runner.temp }}/eventb-animate.jar" "$url"

    - name: Run eventb-animate
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_MODEL_PATH: ${{ inputs.model-path }}
        INPUT_SIZE: ${{ inputs.size }}
        INPUT_STATES: ${{ inputs.states }}
        INPUT_SAVE: ${{ inputs.save }}
        INPUT_TRACE: ${{ inputs.trace }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        cli_args=()

        if [ "$INPUT_COMMAND" = "replay" ]; then
          cli_args+=("replay")
          if [ -z "$INPUT_TRACE" ]; then
            echo "::error::Input 'trace' is required when command is 'replay'"
            exit 1
          fi
          cli_args+=("-t" "$INPUT_TRACE")
          if [ -n "$INPUT_SIZE" ] || [ -n "$INPUT_STATES" ] || [ -n "$INPUT_SAVE" ]; then
            echo "::warning::Inputs 'size', 'states', and 'save' are ignored when command is 'replay'"
          fi
        elif [ "$INPUT_COMMAND" = "check" ]; then
          if [ -n "$INPUT_SIZE" ]; then
            if ! [[ "$INPUT_SIZE" =~ ^[0-9]+$ ]]; then
              echo "::error::Input 'size' must be a positive integer, got '$INPUT_SIZE'"
              exit 1
            fi
            cli_args+=("--size" "$INPUT_SIZE")
          fi
          if [ -n "$INPUT_STATES" ]; then
            if ! [[ "$INPUT_STATES" =~ ^[0-9]+$ ]]; then
              echo "::error::Input 'states' must be a positive integer, got '$INPUT_STATES'"
              exit 1
            fi
            cli_args+=("--states" "$INPUT_STATES")
          fi
          if [ -n "$INPUT_SAVE" ]; then
            cli_args+=("--save" "$INPUT_SAVE")
          fi
        else
          echo "::error::Unknown command '$INPUT_COMMAND'. Must be 'check' or 'replay'."
          exit 1
        fi

        if [ -n "$INPUT_ARGS" ]; then
          # shellcheck disable=SC2086
          cli_args+=($INPUT_ARGS)
        fi

        cli_args+=("$INPUT_MODEL_PATH")

        java -jar "${{ runner.temp }}/eventb-animate.jar" "${cli_args[@]}"
