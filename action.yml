name: 'Event-B Animate'
description: 'Model-check Event-B models using the ProB 2.0 model checker'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  model-path:
    description: 'Path to the Event-B model (.bum file, .zip archive, or directory)'
    required: true
  command:
    description: 'Subcommand to run: "check" (model-check, the default), "replay", "wd", "po", or "cbc"'
    required: false
    default: 'check'
  size:
    description: 'Default size for ProB sets (check, wd, cbc, and po --disprove)'
    required: false
    default: ''
  states:
    description: 'Bound model-checking to at most N explored states; omit for exhaustive (check command)'
    required: false
    default: ''
  save:
    description: 'Save the counterexample trace to a JSON file when a violation is found (check and cbc commands)'
    required: false
    default: ''
  json-report:
    description: 'Write a machine-readable JSON report of the run to this path'
    required: false
    default: ''
  junit-report:
    description: 'Write a JUnit XML report to this path (one testcase per checked property)'
    required: false
    default: ''
  markdown-report:
    description: 'Write a human-readable Markdown report of the run to this path'
    required: false
    default: ''
  trace:
    description: 'Path to JSON trace file (replay command, required when command is "replay")'
    required: false
    default: ''
  args:
    description: 'Extra arguments appended to the assembled command'
    required: false
    default: ''
  version:
    description: 'Release version tag to use (e.g., "v5.1"). Defaults to latest release.'
    required: false
    default: 'latest'
  java-version:
    description: 'Java version to use (must be 21 or later)'
    required: false
    default: '21'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}

    - name: Download eventb-animate
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        release_tag="$VERSION"
        if [ "$VERSION" = "latest" ]; then
          release_url=$(curl --silent --show-error --location --fail \
            --output /dev/null --write-out '%{url_effective}' \
            https://github.com/eventb-rossi/eventb-animate/releases/latest)
          release_tag="${release_url##*/}"
        fi
        release_version="${release_tag#v}"
        url="https://github.com/eventb-rossi/eventb-animate/releases/download/${release_tag}/eventb-animate-${release_version}.jar"
        curl --silent --show-error --location --fail \
          --output "${{ runner.temp }}/eventb-animate.jar" "$url"

    - name: Run eventb-animate
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_MODEL_PATH: ${{ inputs.model-path }}
        INPUT_SIZE: ${{ inputs.size }}
        INPUT_STATES: ${{ inputs.states }}
        INPUT_SAVE: ${{ inputs.save }}
        INPUT_JSON_REPORT: ${{ inputs.json-report }}
        INPUT_JUNIT_REPORT: ${{ inputs.junit-report }}
        INPUT_MARKDOWN_REPORT: ${{ inputs.markdown-report }}
        INPUT_TRACE: ${{ inputs.trace }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        require_positive_int() {
          if ! [[ "$2" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Input '$1' must be a positive integer, got '$2'"
            exit 1
          fi
        }

        if [ -z "$INPUT_MODEL_PATH" ]; then
          echo "::error::Input 'model-path' is required but not set"
          exit 1
        fi

        cli_args=()

        if [ "$INPUT_COMMAND" = "replay" ]; then
          cli_args+=("replay")
          if [ -z "$INPUT_TRACE" ]; then
            echo "::error::Input 'trace' is required when command is 'replay'"
            exit 1
          fi
          cli_args+=("-t" "$INPUT_TRACE")
          if [ -n "$INPUT_SIZE" ] || [ -n "$INPUT_STATES" ] || [ -n "$INPUT_SAVE" ]; then
            echo "::warning::Inputs 'size', 'states', and 'save' are ignored when command is 'replay'"
          fi
        elif [ "$INPUT_COMMAND" = "check" ]; then
          if [ -n "$INPUT_SIZE" ]; then
            require_positive_int size "$INPUT_SIZE"
            cli_args+=("--size" "$INPUT_SIZE")
          fi
          if [ -n "$INPUT_STATES" ]; then
            require_positive_int states "$INPUT_STATES"
            cli_args+=("--states" "$INPUT_STATES")
          fi
          if [ -n "$INPUT_SAVE" ]; then
            cli_args+=("--save" "$INPUT_SAVE")
          fi
        elif [ "$INPUT_COMMAND" = "wd" ] || [ "$INPUT_COMMAND" = "po" ] || [ "$INPUT_COMMAND" = "cbc" ]; then
          cli_args+=("$INPUT_COMMAND")
          if [ -n "$INPUT_SIZE" ]; then
            require_positive_int size "$INPUT_SIZE"
            cli_args+=("--size" "$INPUT_SIZE")
          fi
          if [ "$INPUT_COMMAND" = "cbc" ] && [ -n "$INPUT_SAVE" ]; then
            cli_args+=("--save" "$INPUT_SAVE")
          fi
          if [ -n "$INPUT_STATES" ]; then
            echo "::warning::Input 'states' is ignored when command is '$INPUT_COMMAND'"
          fi
          if [ "$INPUT_COMMAND" != "cbc" ] && [ -n "$INPUT_SAVE" ]; then
            echo "::warning::Input 'save' is ignored when command is '$INPUT_COMMAND'"
          fi
        else
          echo "::error::Unknown command '$INPUT_COMMAND'. Must be 'check', 'replay', 'wd', 'po', or 'cbc'."
          exit 1
        fi

        # The report options work with every command.
        if [ -n "$INPUT_JSON_REPORT" ]; then
          cli_args+=("--json" "$INPUT_JSON_REPORT")
        fi
        if [ -n "$INPUT_JUNIT_REPORT" ]; then
          cli_args+=("--junit" "$INPUT_JUNIT_REPORT")
        fi
        if [ -n "$INPUT_MARKDOWN_REPORT" ]; then
          cli_args+=("--markdown" "$INPUT_MARKDOWN_REPORT")
        fi

        if [ -n "$INPUT_ARGS" ]; then
          # shellcheck disable=SC2086
          cli_args+=($INPUT_ARGS)
        fi

        cli_args+=("$INPUT_MODEL_PATH")

        java -jar "${{ runner.temp }}/eventb-animate.jar" "${cli_args[@]}"
